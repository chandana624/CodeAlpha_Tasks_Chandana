<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FAQ Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 650px;
            max-width: 100%;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            color: #ddd;
            font-size: 14px;
        }

        .chat-area {
            padding: 30px;
        }

        .bot-message {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            color: #333;
        }

        .bot-message strong {
            display: block;
            margin-bottom: 5px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background: #222;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .answer {
            margin-top: 25px;
            padding: 20px;
            background: #f1f3f5;
            border-left: 5px solid #222;
            border-radius: 10px;
        }

        .answer h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .answer p {
            line-height: 1.6;
            margin-bottom: 0;
        }

        .footer {
            text-align: center;
            padding: 15px;
            color: #777;
            font-size: 13px;
            border-top: 1px solid #eee;
        }

        @media (max-width: 600px) {
            .chat-area {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="header">
            <h1>FAQ Chatbot</h1>
            <p>Ask questions and get instant answers</p>
        </div>

        <div class="chat-area">

            <div class="bot-message">
                <strong>Chatbot</strong>
                Hello! Ask me a frequently asked question.
            </div>

            <form method="POST">

                <label for="question">Your Question</label>

                <input
                    type="text"
                    id="question"
                    name="question"
                    placeholder="Example: What is Python?"
                    value="{{ user_question }}"
                    required
                >

                <button type="submit">
                    Ask Question
                </button>

            </form>

            {% if answer %}
            <div class="answer">

                <h2>Chatbot Answer</h2>

                <p>{{ answer }}</p>

            </div>
            {% endif %}

        </div>

        <div class="footer">
            CodeAlpha Artificial Intelligence Internship
        </div>

    </div>

</body>

</html>
