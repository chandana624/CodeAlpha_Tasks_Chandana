<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translation Tool</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f2f5f9;
        }

        .container {
            width: 600px;
            max-width: 100%;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin: 0 0 10px 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: none;
            font-family: Arial, sans-serif;
        }

        .languages {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .language-box {
            flex: 1;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
        }

        .translate-btn {
            display: block;
            width: 100%;
            padding: 13px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .translate-btn:hover {
            background: #555;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .result h2 {
            margin-top: 0;
        }

        #translation {
            font-size: 17px;
            word-wrap: break-word;
        }

        .copy-btn {
            padding: 10px 15px;
            background: #555;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: #333;
        }

        .error {
            margin-top: 25px;
            padding: 15px;
            background: #ffe5e5;
            color: #b00000;
            border-radius: 8px;
        }

        @media (max-width: 600px) {

            .languages {
                flex-direction: column;
            }

            .language-box {
                width: 100%;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Language Translation Tool</h1>

        <p class="subtitle">
            Translate text easily between different languages
        </p>


        <form method="POST">

            <label for="text">
                Enter Text
            </label>

            <textarea
                id="text"
                name="text"
                placeholder="Type your text here..."
                required
            ></textarea>


            <div class="languages">


                <div class="language-box">

                    <label for="source">
                        Source Language
                    </label>

                    <select
                        id="source"
                        name="source"
                    >

                        <option value="en">
                            English
                        </option>

                        <option value="hi">
                            Hindi
                        </option>

                        <option value="kn">
                            Kannada
                        </option>

                        <option value="fr">
                            French
                        </option>

                        <option value="de">
                            German
                        </option>

                        <option value="es">
                            Spanish
                        </option>

                    </select>

                </div>


                <div class="language-box">

                    <label for="target">
                        Target Language
                    </label>

                    <select
                        id="target"
                        name="target"
                    >

                        <option value="hi">
                            Hindi
                        </option>

                        <option value="en">
                            English
                        </option>

                        <option value="kn">
                            Kannada
                        </option>

                        <option value="fr">
                            French
                        </option>

                        <option value="de">
                            German
                        </option>

                        <option value="es">
                            Spanish
                        </option>

                    </select>

                </div>

            </div>


            <button
                class="translate-btn"
                type="submit"
            >
                Translate
            </button>

        </form>


        {% if translated_text %}

        <div class="result">

            <h2>
                Translated Text
            </h2>

            <p id="translation">
                {{ translated_text }}
            </p>

            <button
                class="copy-btn"
                type="button"
                onclick="copyTranslation()"
            >
                Copy Translation
            </button>

        </div>

        {% endif %}


        {% if error_message %}

        <div class="error">

            <strong>
                Notice:
            </strong>

            <p>
                {{ error_message }}
            </p>

        </div>

        {% endif %}

    </div>


    <script>

        function copyTranslation() {

            const translation =
                document.getElementById("translation");

            if (translation) {

                navigator.clipboard
                    .writeText(translation.innerText)
                    .then(function () {

                        alert("Translation copied!");

                    });

            }

        }

    </script>

</body>

</html>
